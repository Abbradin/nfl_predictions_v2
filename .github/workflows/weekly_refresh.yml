name: Update NFL Team Stats and Predictions
on:
  workflow_dispatch:
  schedule:
    # Wednesday, 11:00 UTC. NFL week is usually complete after Monday.
    - cron: '0 11 * 9-12 3'
    - cron: '0 11 * 1-2 3'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify model artifact availability
        run: python check_artifacts.py
      - name: Update features and predictions
        run: python weekly_refresh.py
      - name: Commit latest feature snapshot only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/team_feature_store.parquet
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh completed NFL team stats'
            git push
          fi
